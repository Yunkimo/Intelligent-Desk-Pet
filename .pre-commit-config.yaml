default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: python -m ruff check --fix
        language: system
        types: [python]
        stages: [pre-commit]
      - id: ruff-format
        name: Ruff format
        entry: python -m ruff format
        language: system
        types: [python]
        stages: [pre-commit]
      - id: repository-hygiene
        name: Repository hygiene
        entry: python scripts/check_repo.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: commit-message
        name: Conventional Commit with Chinese description
        entry: python scripts/check_commit.py
        language: system
        stages: [commit-msg]
