name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # Qt offscreen 平台与声音库所需的系统依赖；
          # xvfb/xauth：虚拟 X 服务器，供 pynput 在 import 时探测 X 连接（否则报 Bad display name）。
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-xinerama0 \
            libdbus-1-3 libfontconfig1 libportaudio2 \
            xvfb xauth

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        # xvfb-run 提供虚拟 X 显示器，供 pynput 探测 X 连接；Qt 仍走 offscreen 平台
        run: xvfb-run -a pytest
        env:
          QT_QPA_PLATFORM: offscreen
