name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  lint-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Qt offscreen 平台与声音库所需的系统依赖；
          # xvfb/xauth：虚拟 X 服务器，供 pynput 在 import 时探测 X 连接（否则报 Bad display name）。
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-xinerama0 \
            libdbus-1-3 libfontconfig1 libportaudio2 libpulse0 \
            xvfb xauth

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Check repository hygiene
        run: python scripts/check_repo.py

      - name: Offline server demo
        run: python scripts/demo.py

      - name: Test on Linux
        if: runner.os == 'Linux'
        # xvfb-run 提供虚拟 X 显示器，供 pynput 探测 X 连接；Qt 仍走 offscreen 平台
        run: xvfb-run -a python -m pytest --cov=pet --cov-report=term-missing --cov-report=xml:reports/coverage.xml --junitxml=reports/junit.xml
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Test on Windows
        if: runner.os == 'Windows'
        run: python -m pytest --cov=pet --cov-report=term-missing --cov-report=xml:reports/coverage.xml --junitxml=reports/junit.xml
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Offline GUI selftest
        run: python main.py --demo --selftest --screenshot reports/demo.png
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Collect metrics
        run: python scripts/metrics.py

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-${{ matrix.os }}
          path: reports/

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: mkdir -p reports
      - name: Audit installed Python dependencies
        run: python -m pip_audit --format=json --output=reports/pip-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit
          path: reports/pip-audit.json
