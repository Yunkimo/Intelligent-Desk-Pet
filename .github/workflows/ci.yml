name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # Qt 6 / PyQt6 无头运行所需系统库：offscreen 平台、xcb 系、EGL/GL，
          # 以及 WebEngine、PortAudio 依赖。缺任一个都会在 import PyQt6 时 ImportError。
          # xvfb：虚拟 X 服务器，供 pynput 在 import 时探测 X 连接（否则报 Bad display name）。
          sudo apt-get install -y \
            libegl1 libgl1 libopengl0 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libx11-xcb1 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libxtst6 \
            libdbus-1-3 libfontconfig1 libglib2.0-0 \
            libnss3 libnssutil3 libasound2 \
            libportaudio2 \
            xvfb xauth

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        # xvfb-run 提供虚拟 X 显示器，供 pynput 探测 X 连接；Qt 仍走 offscreen 平台
        run: xvfb-run -a pytest
        env:
          QT_QPA_PLATFORM: offscreen
